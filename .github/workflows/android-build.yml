name: Android build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & sign release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate build metadata
        shell: bash
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Unit tests (redaction, glob matching, diff apply, edit parser). Reported but
      # non-blocking so a flaky test never stops an APK from being built.
      - name: Unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build unsigned release APKs
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      # Each ABI gets its own APK with only its own native libs, plus a universal one.
      # Fork PRs have no secrets, so those APKs are simply left unsigned.
      - name: Sign release APKs
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Push / manual runs must always be signed with the same keystore (an unsigned or
          # differently-signed APK can't update the installed app and Play Protect trusts it less).
          # Only fork PRs (no secrets) may fall back to unsigned APKs.
          REQUIRE_SECRETS: ${{ github.event_name != 'pull_request' && '--require-secrets' || '' }}
        run: bash .github/scripts/sign-apks.sh $REQUIRE_SECRETS

      # Single edition (AI is a runtime toggle in Settings > Behavior), split by ABI + universal.
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: kodex-arm64-v8a-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/signed/kodex-arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: kodex-armeabi-v7a-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/signed/kodex-armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: kodex-universal-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/signed/kodex-universal*.apk
          if-no-files-found: error
          retention-days: 14

name: Android build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & sign release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate build metadata
        shell: bash
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # AI-flavor unit tests (redaction, glob matching, diff apply, edit parser). Reported but
      # non-blocking so a flaky test never stops an APK from being built.
      - name: Unit tests (ai flavor)
        continue-on-error: true
        run: ./gradlew testAiDebugUnitTest --no-daemon

      - name: Build unsigned release APKs
        run: ./gradlew assembleNormalRelease assembleAiRelease --stacktrace --no-daemon

      # Each ABI gets its own APK with only its own native libs, plus a universal one.
      # Fork PRs have no secrets, so those APKs are simply left unsigned.
      - name: Sign release APKs
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash .github/scripts/sign-apks.sh

      # M17: two flavors (normal = no AI, ai = AI assistant), each split by ABI + universal.
      - name: Upload normal arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: kodex-normal-arm64-v8a-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/signed/kodex-normal-arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload normal armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: kodex-normal-armeabi-v7a-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/signed/kodex-normal-armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload normal universal APK
        uses: actions/upload-artifact@v4
        with:
          name: kodex-normal-universal-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/signed/kodex-normal-universal*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AI arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: kodex-ai-arm64-v8a-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/signed/kodex-ai-arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AI armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: kodex-ai-armeabi-v7a-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/signed/kodex-ai-armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AI universal APK
        uses: actions/upload-artifact@v4
        with:
          name: kodex-ai-universal-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/signed/kodex-ai-universal*.apk
          if-no-files-found: error
          retention-days: 14

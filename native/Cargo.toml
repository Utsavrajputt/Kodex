# Native image tracer for the Image tracer tool.
#   vtracer-core   — the VTracer core crate (pixel-exact mode included), vendored.
#   kodex-vtracer  — JNI wrapper, built as libkodex_vtracer.so for Android.
# Build for Android: see native/README.md (cargo-ndk).
[workspace]
members = ["vtracer-core", "kodex-vtracer"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
